<div
  class="min-h-screen bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-pink-500/30 via-fuchsia-950 to-black text-white p-4 md:p-8 font-sans overflow-hidden">

  <!-- Glow Background -->
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-20 w-72 h-72 bg-pink-500/20 blur-[120px] rounded-full"></div>
    <div class="absolute bottom-10 right-10 w-96 h-96 bg-fuchsia-600/20 blur-[140px] rounded-full"></div>
  </div>

  <!-- Header -->
  <header class="relative text-center mb-16">
    <h1
      class="text-5xl md:text-7xl font-black uppercase tracking-tight bg-gradient-to-r from-pink-300 via-fuchsia-400 to-pink-500 bg-clip-text text-transparent drop-shadow-[0_0_20px_rgba(236,72,153,0.5)]">
      Pink Arena
    </h1>

    <p class="mt-3 text-pink-200/70 tracking-[0.4em] text-xs md:text-sm uppercase font-bold">
      Ultimate E-Games Championship
    </p>
  </header>

  <div
    class="relative max-w-5xl mx-auto mb-16 rounded-3xl border border-pink-500/20 bg-white/5 backdrop-blur-xl shadow-[0_0_60px_rgba(236,72,153,0.15)] p-6">

    <div class="grid md:grid-cols-3 gap-4">

      <div class="md:col-span-1">
        <label class="text-[11px] uppercase tracking-widest text-pink-300 font-bold ml-1">
          Nome da Equipe
        </label>

        <input
          [(ngModel)]="novoTime.nome"
          placeholder="Ex: Queens, Pink Fury..."
          class="w-full mt-2 bg-pink-950/40 border border-pink-500/20 focus:border-pink-400 focus:ring-2 focus:ring-pink-500/40 outline-none transition-all rounded-2xl px-5 py-4 text-lg placeholder:text-pink-200/30">
      </div>
      <div class="md:col-span-1">
        <label class="text-[11px] uppercase tracking-widest text-pink-300 font-bold ml-1">
          Logo
        </label>

        <input
          [(ngModel)]="novoTime.logo"
          placeholder="Ex: Os mais mais, Resenhudos..."
          class="w-full mt-2 bg-pink-950/40 border border-pink-500/20 focus:border-pink-400 focus:ring-2 focus:ring-pink-500/40 outline-none transition-all rounded-2xl px-5 py-4 text-lg placeholder:text-pink-200/30">
      </div>

      <div>
        <label class="text-[11px] uppercase tracking-widest text-pink-300 font-bold ml-1">
          Modalidade
        </label>

        <select
          [(ngModel)]="novoTime.jogo"
          class="w-full mt-2 bg-pink-950/40 border border-pink-500/20 focus:border-pink-400 focus:ring-2 focus:ring-pink-500/40 outline-none transition-all rounded-2xl px-5 py-4 text-white">

          <option value="">Selecione</option>
          <option value="Valorant">Valorant</option>
          <option value="League of Legends">League of Legends</option>
          <option value="Free Fire">Free Fire</option>
          <option value="CS2">Counter-Strike 2</option>
          <option value="Wild Rift">Wild Rift</option>

        </select>
      </div>
      <div>
        <label class="text-[11px] uppercase tracking-widest text-pink-300 font-bold ml-1">
          País
        </label>

        <select
          [(ngModel)]="novoTime.pais"
          class="w-full mt-2 bg-pink-950/40 border border-pink-500/20 focus:border-pink-400 focus:ring-2 focus:ring-pink-500/40 outline-none transition-all rounded-2xl px-5 py-4 text-white">

          <option value="">Selecione</option>
          <option value="Brasil">Brasil</option>
          <option value="EUA">EUA</option>
          <option value="UK">UK</option>
          <option value="México">México</option>
          <option value="Canadá">Canadá</option>

        </select>
      </div>
  


      <div class="flex items-end">
        <button
          (click)="adicionar()"
          class="w-full py-4 rounded-2xl bg-gradient-to-r from-pink-500 via-fuchsia-500 to-pink-600 hover:scale-105 active:scale-95 transition-all duration-300 font-black uppercase tracking-widest shadow-[0_0_25px_rgba(236,72,153,0.5)]">

          ✦ Recrutar
        </button>
      </div>

    </div>
  </div>


  <div class="relative max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">

    <div
      *ngFor="let t of times"
      class="group relative rounded-3xl overflow-hidden border border-pink-500/10 bg-white/5 backdrop-blur-xl transition-all duration-500 hover:-translate-y-3 hover:border-pink-400/40 shadow-[0_0_40px_rgba(236,72,153,0.08)]">

      <div
        class="absolute inset-0 opacity-0 group-hover:opacity-100 transition duration-500 bg-gradient-to-br from-pink-500/10 via-fuchsia-500/10 to-transparent">
      </div>

      <div class="relative p-6 flex flex-col h-full">

        <div class="flex justify-between items-start">

          <span
            class="px-4 py-1 rounded-full bg-pink-500/10 border border-pink-400/20 text-pink-200 text-[10px] uppercase tracking-widest font-bold">
            {{ t.jogo }}
          </span>

          <button
            (click)="remover(t.id)"
            class="text-pink-200/40 hover:text-red-400 hover:rotate-90 transition-all duration-300">

            ✕
          </button>

        </div>

        <h2 class="mt-6 text-4xl font-black tracking-tight text-white truncate">
          {{ t.nome }}
        </h2>

        <!-- Stats -->
        <div
          class="mt-8 rounded-2xl bg-black/30 border border-pink-500/10 p-5 flex justify-between items-center">

          <div>
            <p class="text-[10px] uppercase tracking-[0.3em] text-pink-300/50 font-bold">
              Rank
            </p>

            <p
              class="text-2xl font-black italic"
              [ngClass]="{
                'text-yellow-300 drop-shadow-[0_0_10px_rgba(253,224,71,0.7)]': t.rank === 'Ouro',
                'text-gray-200 drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]': t.rank === 'Prata',
                'text-orange-400 drop-shadow-[0_0_10px_rgba(251,146,60,0.5)]': t.rank === 'Bronze'
              }">

              {{ t.rank }}

            </p>
          </div>

          <div class="text-center">
            <p class="text-[10px] uppercase tracking-[0.3em] text-pink-300/50 font-bold">
              Wins
            </p>

            <p class="text-4xl font-black text-pink-200">
              {{ t.vitorias }}
            </p>
          </div>

        </div>

        <button
          (click)="vitoria(t.id)"
          class="mt-8 w-full rounded-2xl py-4 uppercase tracking-[0.2em] font-black
          bg-gradient-to-r from-pink-500 to-fuchsia-600
          hover:from-fuchsia-500 hover:to-pink-500
          transition-all duration-300
          hover:scale-105 active:scale-95
          shadow-[0_0_30px_rgba(236,72,153,0.4)]">

          🏆 Registrar Vitória

        </button>

      </div>
    </div>

  </div>

  <div
    *ngIf="times.length === 0"
    class="relative text-center mt-20 text-pink-200/50">

    <h2 class="text-4xl font-black">
      Nenhuma equipe cadastrada
    </h2>

    <p class="mt-3 tracking-wider uppercase text-sm">
      Monte o primeiro squad da Pink Arena
    </p>

  </div>

</div>
